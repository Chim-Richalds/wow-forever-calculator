<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent value calculator</title>
<style>
:root {
  --paper: #dfe6ea;
  --panel: #f5f8fa;
  --panel-2: #eaeff2;
  --ink: #16232d;
  --ink-2: #4a5b68;
  --rule: #b6c3cc;
  --good: #0f6a5f;
  --good-bg: #d3ebe6;
  --warn: #9a5a06;
  --warn-bg: #f4e5c8;
  --bad: #a3322a;
  --bad-bg: #f3d9d5;
  --pick: #284f8f;
  --radius: 6px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a22; --panel: #17252f; --panel-2: #1d2f3b; --ink: #e3ebf0; --ink-2: #9db0bd; --rule: #2e4352;
    --good: #5fd0bf; --good-bg: #123a36; --warn: #e9b258; --warn-bg: #3d2f12; --bad: #f08a80; --bad-bg: #44211e; --pick: #8db4ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1a22; --panel: #17252f; --panel-2: #1d2f3b; --ink: #e3ebf0; --ink-2: #9db0bd; --rule: #2e4352;
  --good: #5fd0bf; --good-bg: #123a36; --warn: #e9b258; --warn-bg: #3d2f12; --bad: #f08a80; --bad-bg: #44211e; --pick: #8db4ff;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.bar h1 { font-size: 22px; margin-right: 8px; align-self: center; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--ink-2); }
.field select, .field input { padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); min-height: 34px; }
.field input[type=number] { width: 78px; }
.check { display: flex; align-items: center; gap: 6px; min-height: 34px; font-size: 14px; color: var(--ink); }
.spacer { flex: 1; }
.btn { padding: 6px 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel-2); min-height: 34px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.danger { color: var(--bad); }

main { display: grid; grid-template-columns: minmax(280px, var(--left, 1.25fr)) 14px minmax(300px, 1fr); gap: 0; padding: 16px 20px 40px; align-items: start; }
#split { align-self: stretch; position: relative; cursor: col-resize; touch-action: none; border-radius: 4px; outline-offset: -2px; }
#split::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--rule); transition: background .15s; }
#split:hover::after, #split:focus-visible::after, #split.drag::after { background: var(--pick); }
#split::before { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 36px; margin: -18px 0 0 -3px; border-radius: 3px; background: var(--panel); border: 1px solid var(--rule); z-index: 1; }
body.dragging { cursor: col-resize; user-select: none; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; gap: 16px; padding: 12px 16px 40px; } #split { display: none; } }
section.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
.card > header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.card > header h2 { font-size: 18px; }
.card .body { padding: 14px 16px; }

.points { font-family: var(--serif); font-size: 20px; }
.points.over { color: var(--bad); }
.banner { margin: 0 0 12px; padding: 10px 12px; border-radius: var(--radius); background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
.banner ul { margin: 6px 0 0 18px; padding: 0; }
.hint { color: var(--ink-2); font-size: 13px; }

#treewrap { overflow: auto; max-height: 76vh; background: var(--panel-2); border-radius: var(--radius); border: 1px solid var(--rule); }
#tree { margin: 16px; }
.specs { display: flex; flex-wrap: wrap; gap: 20px 36px; justify-content: center; }
.spec h3 { font-size: 15px; margin-bottom: 6px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; display: flex; justify-content: space-between; }
.canvas { position: relative; }
.canvas svg { position: absolute; inset: 0; pointer-events: none; }
.canvas line { stroke: var(--rule); stroke-width: 3; }
.node { position: absolute; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; text-align: center; }
.node .disc { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--rule); background: var(--panel); display: grid; place-items: center; font: 600 15px var(--serif); color: var(--ink-2); overflow: hidden; }
.node .disc img { width: 100%; height: 100%; display: block; object-fit: cover; }
.node:not(.on) .disc img { filter: grayscale(.85) brightness(.8); }
.node .name { font-size: 11px; line-height: 1.15; max-width: 76px; color: var(--ink); overflow-wrap: anywhere; }
.node .pips { display: flex; gap: 2px; height: 6px; }
.node .pips i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink-2); }
.node .pips i.f { background: var(--ink); border-color: var(--ink); }
.node.mod .disc { border-style: solid; border-color: var(--good); color: var(--good); }
.node.partly .disc { border-style: dashed; }
.node.plain .disc { border-style: dotted; }
.node.can .disc { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pick) 35%, transparent); }
.node.on .disc { background: var(--good-bg); color: var(--ink); }
.node.on:not(.mod) .disc { background: var(--panel-2); }
.node.full .disc { border-width: 3px; }
.node.locked { opacity: .78; }
.node.on { opacity: 1; }
.node.flash .disc { animation: nudge .25s; }
@keyframes nudge { 30% { transform: translateX(-3px); } 60% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .node.flash .disc { animation: none; outline: 2px solid var(--bad); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--rule); }
.legend .l-mod::before { border-color: var(--good); }
.legend .l-part::before { border-color: var(--good); border-style: dashed; }
.legend .l-plain::before { border-style: dotted; }
.legend .l-can::before { box-shadow: 0 0 0 2px color-mix(in srgb, var(--pick) 35%, transparent); }

#tip { position: fixed; z-index: 5; max-width: 340px; padding: 10px 12px; background: var(--ink); color: var(--paper); border-radius: var(--radius); font-size: 13px; pointer-events: none; display: none; }
#tip h3 { font-size: 15px; margin-bottom: 4px; }
#tip p { margin: 4px 0; }
#tip .dim { opacity: .75; }
#tip .tag { display: inline-block; padding: 0 6px; border-radius: 3px; background: var(--warn-bg); color: var(--warn); font-size: 11px; }

.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--rule); }
.tabs button { padding: 8px 14px; border: 1px solid transparent; border-bottom: 0; background: none; border-radius: var(--radius) var(--radius) 0 0; color: var(--ink-2); }
.tabs button[aria-selected=true] { background: var(--panel); border-color: var(--rule); color: var(--ink); margin-bottom: -1px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
td.est { color: var(--warn); }
td.pm { color: var(--ink-2); font-size: 12px; text-align: left; }
.tiny { font-size: 12px; color: var(--ink-2); }
.adj { width: 66px; padding: 3px 5px; text-align: right; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }
h3.sub { font-size: 15px; margin: 18px 0 6px; }
.notes { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.notes li { padding: 6px 8px; margin-bottom: 4px; border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--ink); border-radius: 0 4px 4px 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.seg button { padding: 5px 12px; border: 0; background: none; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
#values th button { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink-2); }
#values td.v { position: relative; }
#values td.v b { position: absolute; inset: 3px 0 3px auto; background: var(--good-bg); z-index: 0; border-radius: 3px; }
#values td.v b.neg { background: var(--bad-bg); }
#values td.v span { position: relative; z-index: 1; padding-right: 3px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--rule); }
.pill.verified, .pill.confirmed-by-you { color: var(--good); border-color: var(--good); }
.pill.inferred, .pill.estimated, .pill.reference { color: var(--warn); border-color: var(--warn); }
.pill.doubtful, .pill.unverified { color: var(--bad); border-color: var(--bad); }
.ok { color: var(--good); }
.bad { color: var(--bad); }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--radius); display: none; z-index: 6; max-width: 90vw; }
.builds { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.empty { color: var(--ink-2); padding: 14px 4px; }
</style>
</head>
<body>
<header class="bar" role="group" aria-label="Character">
  <h1>Talent value calculator</h1>
  <label class="field">Class <select id="class"></select></label>
  <label class="field">Race <select id="race"></select></label>
  <label class="field">Level <input id="level" type="number" min="1" max="60" value="60"></label>
  <label class="check"><input id="shield" type="checkbox"> Wearing a shield</label>
  <label class="field" id="attackerField" hidden>Attacker level <input id="attacker" type="number" min="1" max="70"></label>
  <label class="check" id="playerField" hidden><input id="vsplayer" type="checkbox"> Attacker is a player</label>
  <span class="spacer"></span>
  <div class="builds">
    <label class="field">Saved builds <input id="buildname" list="buildlist" placeholder="Name"></label>
    <datalist id="buildlist"></datalist>
    <button class="btn" id="save" type="button">Save</button>
    <button class="btn" id="load" type="button">Load</button>
    <button class="btn danger" id="delete" type="button">Delete</button>
  </div>
</header>

<main>
  <section class="card" aria-labelledby="treetitle">
    <header>
      <h2 id="treetitle">Talents</h2>
      <span class="points num" id="points" aria-live="polite"></span>
      <span class="spacer"></span>
      <button class="btn" id="reset" type="button">Clear all</button>
    </header>
    <div class="body">
      <div id="banner" class="banner" hidden role="alert"></div>
      <div id="treewrap"><div id="tree"></div></div>
      <div class="legend" aria-hidden="true">
        <span class="l-mod">Value is calculated</span>
        <span class="l-part">Partly calculated</span>
        <span class="l-plain">Not calculated</span>
        <span class="l-can">Can take a rank now</span>
      </div>
      <p class="hint">Click to add a rank. Right-click or press Backspace to remove one. Hover or focus a talent to read it.</p>
    </div>
  </section>

  <div id="split" role="separator" aria-orientation="vertical" aria-label="Resize the talent panel and the stat sheet" aria-valuemin="0" aria-valuemax="100" tabindex="0" title="Drag to resize. Arrow keys also work. Double-click to reset."></div>

  <section class="card" aria-label="Results">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-sheet" aria-selected="true" data-tab="sheet">Stat sheet</button>
      <button role="tab" id="tab-values" aria-selected="false" data-tab="values">Talent values</button>
      <button role="tab" id="tab-data" aria-selected="false" data-tab="data">Data and confidence</button>
    </div>
    <div class="body" id="pane-sheet" role="tabpanel" aria-labelledby="tab-sheet"></div>
    <div class="body" id="pane-values" role="tabpanel" aria-labelledby="tab-values" hidden></div>
    <div class="body" id="pane-data" role="tabpanel" aria-labelledby="tab-data" hidden></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LABEL = { strength: "Strength", agility: "Agility", stamina: "Stamina", intellect: "Intellect", spirit: "Spirit", health: "Health", mana: "Mana",
  melee_crit: "Melee crit", spell_crit: "Spell crit", melee_hit: "Melee hit", spell_hit: "Spell hit", dodge: "Dodge", parry: "Parry", block: "Block", casting_regen: "Mana regen while casting",
  attack_power: "Attack power", armor: "Armor", spell_power: "Spell power", healing: "Healing" };
const PERCENT = new Set(["melee_crit", "spell_crit", "melee_hit", "spell_hit", "dodge", "parry", "block", "casting_regen"]);
const STATS = ["health", "mana", "strength", "agility", "stamina", "intellect", "spirit"];
const ORDER = [...STATS, "melee_crit", "spell_crit", "melee_hit", "spell_hit", "dodge", "parry", "block", "casting_regen", "attack_power", "armor", "spell_power", "healing"];

const S = { meta: null, tree: null, nodes: new Map(), cls: null, race: null, alloc: {}, adjust: {}, result: null, tab: "sheet",
  mode: "now", sort: null, seq: 0, timer: null, status: null };

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({ error: "The server sent something unreadable." }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(text) {
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = "none"; }, 4200);
}
const fmt = (v, dp = 2) => (v == null ? "–" : Number(v).toFixed(dp));
const signed = (v, dp = 0) => (v == null ? "" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(dp));
function metricText(key, v, withSign) {
  const pct = PERCENT.has(key);
  const dp = pct ? 2 : 0;
  const body = withSign ? signed(v, dp) : fmt(v, dp);
  return body + (pct && v != null ? "%" : "");
}

// ------------------------------------------------------------------ setup
// ------------------------------------------------------------------ resizable panels
function setupSplit() {
  const main = document.querySelector("main"), bar = $("split"), KEY = "wowcalc.split";
  const bounds = () => { const w = main.clientWidth - 40 - 14; return { w, lo: 280, hi: Math.max(280, w - 300) }; };
  const apply = (frac, save) => {
    const { w, lo, hi } = bounds(), px = Math.round(Math.min(hi, Math.max(lo, frac * w)));
    main.style.setProperty("--left", px + "px");
    bar.setAttribute("aria-valuenow", String(Math.round((px / w) * 100)));
    if (save) { try { localStorage.setItem(KEY, String(px / w)); } catch (_) {} }
    return px / w;
  };
  let frac = null;
  try { const v = Number(localStorage.getItem(KEY)); if (v > 0 && v < 1) frac = v; } catch (_) {}
  const reset = () => { main.style.removeProperty("--left"); bar.removeAttribute("aria-valuenow"); frac = null; try { localStorage.removeItem(KEY); } catch (_) {} };
  if (frac !== null) apply(frac, false);
  bar.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); bar.setPointerCapture(ev.pointerId); bar.classList.add("drag"); document.body.classList.add("dragging");
    const move = (e) => { const r = main.getBoundingClientRect(); frac = apply((e.clientX - r.left - 20 - 7) / bounds().w, false); };
    const up = () => {
      bar.classList.remove("drag"); document.body.classList.remove("dragging");
      bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up);
      if (frac !== null) apply(frac, true);
    };
    bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
  });
  bar.addEventListener("keydown", (ev) => {
    const w = bounds().w, cur = parseFloat(getComputedStyle(main).getPropertyValue("--left")) || (w * 0.55), step = ev.shiftKey ? 80 : 24;
    if (ev.key === "ArrowLeft") frac = apply((cur - step) / w, true);
    else if (ev.key === "ArrowRight") frac = apply((cur + step) / w, true);
    else if (ev.key === "Home") frac = apply(280 / w, true);
    else if (ev.key === "End") frac = apply(1, true);
    else if (ev.key === "Enter" || ev.key === "Escape") reset();
    else return;
    ev.preventDefault();
  });
  bar.addEventListener("dblclick", reset);
  window.addEventListener("resize", () => { if (frac !== null) apply(frac, false); });
}

async function init() {
  setupSplit();
  try {
    S.meta = await api("GET", "/api/meta");
  } catch (e) { document.body.innerHTML = `<p class="banner">${esc(e.message)}</p>`; return; }
  const cs = $("class");
  cs.innerHTML = Object.keys(S.meta.classes).map((c) => `<option>${esc(c)}</option>`).join("");
  $("level").min = S.meta.levels[0]; $("level").max = S.meta.levels[1]; $("level").value = S.meta.levels[1];
  cs.addEventListener("change", () => pickClass(cs.value, true));
  $("race").addEventListener("change", () => { S.race = $("race").value; queue(); });
  for (const id of ["level", "attacker"]) $(id).addEventListener("input", queue);
  for (const id of ["shield", "vsplayer"]) $(id).addEventListener("change", () => { syncShield(); queue(); });
  $("reset").addEventListener("click", () => { S.alloc = {}; queue(); });
  $("save").addEventListener("click", saveBuild);
  $("load").addEventListener("click", loadBuild);
  $("delete").addEventListener("click", deleteBuild);
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  buildSheetSkeleton();
  await refreshBuilds();
  await pickClass(Object.keys(S.meta.classes)[0], true);
  for (const note of S.meta.notes) toast(note);
}
async function pickClass(cls, reset) {
  S.cls = cls; $("class").value = cls;
  const races = S.meta.classes[cls];
  $("race").innerHTML = races.map((r) => `<option>${esc(r)}</option>`).join("");
  S.race = races.includes(S.race) ? S.race : races[0]; $("race").value = S.race;
  if (reset) { S.alloc = {}; }
  S.tree = await api("GET", "/api/tree/" + encodeURIComponent(cls));
  S.nodes = new Map(S.tree.nodes.map((n) => [n.id, n]));
  $("treetitle").textContent = cls + " talents";
  drawTree();
  await evaluate();
}
function syncShield() {
  const on = $("shield").checked;
  $("attackerField").hidden = !on; $("playerField").hidden = !on;
}
function queue() { clearTimeout(S.timer); S.timer = setTimeout(evaluate, 120); }

function request() {
  return { class: S.cls, race: S.race, level: Number($("level").value), alloc: S.alloc, adjust: S.adjust,
    shield: $("shield").checked, attacker_level: $("attacker").value === "" ? null : Number($("attacker").value), vs_player: $("vsplayer").checked };
}
async function evaluate() {
  const mine = ++S.seq;
  try {
    const r = await api("POST", "/api/evaluate", request());
    if (mine !== S.seq) return;
    S.result = r; render();
  } catch (e) { if (mine === S.seq) { $("banner").hidden = false; $("banner").textContent = e.message; } }
}

// ------------------------------------------------------------------ tree
const CELL = 84, ROW = 104;
// Each specialisation tree sits in its own block, side by side when there is room and stacked when there is not.
function groupNodes(nodes) {
  const groups = new Map();
  for (const n of nodes) if (n.sub >= 0) { if (!groups.has(n.sub)) groups.set(n.sub, []); groups.get(n.sub).push(n); }
  const spans = [...groups].map(([k, ns]) => [k, Math.min(...ns.map((n) => n.x)), Math.max(...ns.map((n) => n.x))]);
  for (const n of nodes) {  // a node in no sub-tree joins the block whose columns are nearest to it
    if (n.sub >= 0) continue;
    if (!spans.length) { if (!groups.has(-1)) groups.set(-1, []); groups.get(-1).push(n); continue; }
    const near = spans.map(([k, lo, hi]) => [k, n.x < lo ? lo - n.x : n.x > hi ? n.x - hi : 0]).sort((p, q) => p[1] - q[1])[0][0];
    groups.get(near).push(n);
  }
  return [...groups].sort((p, q) => Math.min(...p[1].map((n) => n.x)) - Math.min(...q[1].map((n) => n.x)));
}
function drawTree() {
  const nodes = S.tree.nodes, host = $("tree"), g = S.tree.grid;
  if (!nodes.length) { host.innerHTML = '<p class="empty">This class has no talents in this build.</p>'; return; }
  host.innerHTML = ""; S.groups = [];
  const wrap = document.createElement("div"); wrap.className = "specs"; host.appendChild(wrap);
  groupNodes(nodes).forEach(([key, members], i) => {
    const minX = Math.min(...members.map((n) => n.x)), minY = Math.min(...members.map((n) => n.y));
    const pos = (n) => ({ x: (n.x - minX) / g * CELL, y: (n.y - minY) / g * ROW });
    const width = Math.max(...members.map((n) => pos(n).x)) + 76, height = Math.max(...members.map((n) => pos(n).y)) + 84;
    const box = document.createElement("div"); box.className = "spec";
    box.innerHTML = `<h3><span>${esc((S.tree.specs && S.tree.specs[key]) || `Tree ${i + 1}`)}</span> <span class="num tiny" data-spent></span></h3>`;
    const canvas = document.createElement("div"); canvas.className = "canvas"; canvas.style.width = width + "px"; canvas.style.height = height + "px";
    const ids = new Set(members.map((n) => n.id));
    let svg = `<svg width="${width}" height="${height}" aria-hidden="true">`;
    for (const e of S.tree.edges) {
      if (!ids.has(e.from) || !ids.has(e.to)) continue;
      const p = pos(S.nodes.get(e.from)), q = pos(S.nodes.get(e.to));
      svg += `<line x1="${p.x + 38}" y1="${p.y + 23}" x2="${q.x + 38}" y2="${q.y + 23}"></line>`;
    }
    canvas.innerHTML = svg + "</svg>";
    for (const n of members) {
      const p = pos(n);
      const b = document.createElement("button");
      b.type = "button"; b.className = "node"; b.dataset.id = n.id;
      b.style.left = p.x + "px"; b.style.top = p.y + "px";
      b.innerHTML = `<span class="disc">${n.icon ? `<img alt="" src="/icons/${esc(n.icon)}">` : esc(initials(n.name))}</span><span class="name">${esc(n.name)}</span><span class="pips"></span>`;
      const img = b.querySelector("img");
      if (img) img.addEventListener("error", () => { img.parentNode.textContent = initials(n.name); });
      b.addEventListener("click", (ev) => step(n.id, ev.shiftKey ? n.max : 1));
      b.addEventListener("contextmenu", (ev) => { ev.preventDefault(); step(n.id, -1); });
      b.addEventListener("keydown", (ev) => { if (ev.key === "Backspace" || ev.key === "Delete") { ev.preventDefault(); step(n.id, -1); } });
      b.addEventListener("mouseenter", (ev) => showTip(n, ev));
      b.addEventListener("mousemove", moveTip);
      b.addEventListener("mouseleave", hideTip);
      b.addEventListener("focus", () => showTip(n, null, b));
      b.addEventListener("blur", hideTip);
      canvas.appendChild(b);
    }
    box.appendChild(canvas); wrap.appendChild(box);
    S.groups.push({ ids, label: box.querySelector("[data-spent]") });
  });
}
const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

function step(id, by) {
  const n = S.nodes.get(id), st = S.result && S.result.nodes[id], have = S.alloc[id] || 0;
  if (by > 0) {
    if (by > 1) { S.alloc[id] = n.max; queue(); return; }
    if (st && !st.can_add) { flash(id, (st.why_not[0] || "This talent cannot take another rank yet.")); return; }
    S.alloc[id] = have + 1;
  } else {
    if (!have) return;
    if (st && !st.can_remove) { flash(id, st.why_stuck[0] || "Removing this rank would break the build."); return; }
    S.alloc[id] = have - 1; if (!S.alloc[id]) delete S.alloc[id];
  }
  queue();
}
function flash(id, text) {
  const el = document.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  toast(text);
}
function paintTree() {
  const r = S.result; if (!r) return;
  for (const g of S.groups || []) {
    const used = [...g.ids].reduce((t, id) => t + (r.nodes[id] ? r.nodes[id].ranks : 0), 0) * S.tree.cost_per_rank;
    g.label.textContent = used ? `${used} points` : "";
  }
  for (const el of document.querySelectorAll(".node")) {
    const n = S.nodes.get(el.dataset.id), st = r.nodes[n.id], have = st.ranks;
    el.className = "node " + (n.modelled ? (n.partly ? "mod partly" : "mod") : "plain") + (have ? " on" : "") + (have === n.max ? " full" : "")
      + (st.can_add ? " can" : "") + (!have && !st.can_add ? " locked" : "");
    el.setAttribute("aria-label", `${n.name}, ${have} of ${n.max} ranks${st.can_add ? ", can take a rank" : ""}`);
    el.querySelector(".pips").innerHTML = Array.from({ length: n.max }, (_, i) => `<i class="${i < have ? "f" : ""}"></i>`).join("");
  }
}

// ------------------------------------------------------------------ tooltip
function tipHtml(n) {
  const st = S.result && S.result.nodes[n.id], have = st ? st.ranks : 0;
  const shown = n.ranks[Math.max(0, Math.min(n.max, have || 1) - 1)];
  const next = have && have < n.max ? n.ranks[have] : null;
  const val = S.result && S.result.values.find((v) => v.id === n.id);
  let h = `<h3>${esc(n.name)} <span class="dim">${have}/${n.max}</span></h3>`;
  if (shown) h += `<p>${esc(shown.text || "No description in the data.")}${shown.complete ? "" : ' <span class="dim">(text not fully rendered)</span>'}</p>`;
  if (next) h += `<p class="dim">Next rank: ${esc(next.text)}</p>`;
  const lines = [];
  if (val) {
    const part = (o) => ORDER.filter((k) => o[k] != null).map((k) => `${LABEL[k]} ${metricText(k, o[k], true)}`).join(", ");
    if (have && part(val.now)) lines.push("Worth now: " + part(val.now));
    if (part(val.next)) lines.push("Next rank adds: " + part(val.next));
  }
  for (const l of lines) h += `<p>${esc(l)}</p>`;
  const un = n.effects.filter((e) => !e.modelled);
  if (!n.modelled) h += '<p><span class="tag">Not calculated</span> The calculator cannot value this talent yet.</p>';
  else if (un.length) h += '<p><span class="tag">Partly calculated</span> Some effects are not valued.</p>';
  if (st && !st.can_add && have < n.max && st.why_not.length) h += `<p class="dim">${esc(st.why_not[0])}</p>`;
  return h;
}
function showTip(n, ev, anchor) {
  S.tipNode = n;
  const tip = $("tip"); tip.innerHTML = tipHtml(n); tip.style.display = "block";
  if (ev) moveTip(ev); else if (anchor) { const r = anchor.getBoundingClientRect(); place(r.right + 8, r.top); }
}
function refreshTip() { if (S.tipNode && $("tip").style.display === "block") $("tip").innerHTML = tipHtml(S.tipNode); }
function moveTip(ev) { place(ev.clientX + 16, ev.clientY + 16); }
function place(x, y) {
  const tip = $("tip"), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
  tip.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px";
}
function hideTip() { S.tipNode = null; $("tip").style.display = "none"; }

// ------------------------------------------------------------------ results
function render() {
  const r = S.result;
  const over = r.spent > r.budget;
  $("points").innerHTML = `${r.spent} of ${r.budget} points`;
  $("points").className = "points num" + (over ? " over" : "");
  const b = $("banner");
  if (!r.legal) { b.hidden = false; b.innerHTML = "This build is not legal:<ul>" + r.problems.map((p) => `<li>${esc(p)}</li>`).join("") + "</ul>"; }
  else b.hidden = true;
  paintTree();
  renderSheet(); renderValues(); refreshTip();
  if (S.tab === "data") renderData();
}
function showTab(tab) {
  S.tab = tab;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  for (const t of ["sheet", "values", "data"]) $("pane-" + t).hidden = t !== tab;
  if (tab === "data") renderData();
}

function buildSheetSkeleton() {
  let rows = "";
  for (const k of STATS) rows += `<tr id="row-${k}"><td>${LABEL[k]}</td><td class="num b"></td><td><input class="adj num" type="number" data-adj="${k}" aria-label="Extra ${LABEL[k]} from gear and buffs" value="0"></td><td class="num t"></td><td class="num total"></td></tr>`;
  $("pane-sheet").innerHTML = `
    <table aria-label="Base stats"><thead><tr><th>Stat</th><th>Base</th><th>Gear and buffs</th><th>Talents</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table>
    <h3 class="sub">Combat figures</h3><div id="figures"></div>
    <ul class="notes" id="notes"></ul>
    <h3 class="sub" id="nmhead" hidden>Not valued by the calculator</h3><div id="notmodelled" class="tiny"></div>`;
  $("pane-sheet").addEventListener("input", (ev) => {
    const k = ev.target.dataset && ev.target.dataset.adj; if (!k) return;
    const v = ev.target.value === "" ? 0 : Number(ev.target.value);
    if (Number.isFinite(v) && Number.isInteger(v)) { if (v) S.adjust[k] = v; else delete S.adjust[k]; queue(); }
  });
  $("pane-sheet").addEventListener("input", (ev) => {
    const key = { armorgear: "armor", spellgear: "spell_power", healinggear: "healing" }[ev.target.id]; if (!key) return;
    const v = Number(ev.target.value || 0);
    if (Number.isInteger(v)) { if (v) S.adjust[key] = v; else delete S.adjust[key]; queue(); }
  });
}
function renderSheet() {
  const sh = S.result.sheet;
  for (const k of STATS) {
    const l = sh.lines[k], row = $("row-" + k);
    row.hidden = l.base == null;
    row.querySelector(".b").textContent = l.base ?? "–";
    row.querySelector(".b").className = "num b" + (l.base != null && !l.exact ? " est" : "");
    row.querySelector(".b").title = l.base != null && !l.exact ? "Estimated: a straight line between the supplied levels" : "";
    row.querySelector(".t").textContent = l.talents ? signed(l.talents) : "";
    row.querySelector(".total").textContent = l.total ?? "–";
  }
  let f = '<table aria-label="Combat figures"><thead><tr><th>Figure</th><th>Base</th><th>Talents</th><th>Gear and buffs</th><th>Total</th></tr></thead><tbody>';
  const cell = (x, key, sign) => (x == null || x[key] == null || (sign && !x[key]) ? "" : (sign ? signed(x[key], 2) : fmt(x[key])) + "%");
  const both = (a, b, key, sign) => {      // one value when melee and spell agree, otherwise "melee / spell"
    const m = cell(a, key, sign), s = cell(b, key, sign);
    return m === s || !b ? m : !a ? s : `${m || "0%"} / ${s || "0%"}`;
  };
  for (const k of ["melee_crit", "spell_crit", "hit", "dodge", "parry", "block", "casting_regen"]) {
    let x, row;
    if (k === "hit") {
      const a = sh.figures.melee_hit, b = sh.figures.spell_hit; if (!a && !b) continue;
      const same = (key) => !a || !b || a[key] === b[key];
      const tip = same("base") && same("talents") && same("total") ? "" : ' title="Melee hit / spell hit. They differ here, so both are shown."';
      row = `<tr><td${tip}>Hit</td><td class="num">${both(a, b, "base") || "–"}</td><td class="num">${both(a, b, "talents", true)}</td><td class="num">${both(a, b, "adjust", true)}</td><td class="num">${a && b && !same("total") ? `<strong>${both(a, b, "total")}</strong>` : `<strong>${both(a, b, "total") || "–"}</strong>`}</td></tr>`;
      f += row; continue;
    }
    x = sh.figures[k]; if (!x) continue;
    const pm = x.plus_minus >= 0.005 ? ` <span class="tiny">±${fmt(x.plus_minus)}</span>` : "";
    f += `<tr><td>${LABEL[k]}</td><td class="num">${x.base == null ? "–" : fmt(x.base) + "%"}</td><td class="num">${x.talents ? signed(x.talents, 2) + "%" : ""}</td><td class="num">${x.adjust ? signed(x.adjust, 2) + "%" : ""}</td><td class="num">${x.total == null ? "–" : "<strong>" + fmt(x.total) + "%</strong>"}${pm}</td></tr>`;
  }
  const ap = sh.attack_power;
  if (ap.base != null || ap.talents || ap.adjust) f += `<tr><td>Attack power</td><td class="num">${ap.base ?? "–"}</td><td class="num">${ap.talents ? signed(ap.talents) : ""}</td><td class="num">${ap.adjust ? signed(ap.adjust) : ""}</td><td class="num"><strong>${ap.total ?? "–"}</strong></td></tr>`;
  const ar = sh.armor;
  if (ar.base != null) f += `<tr><td>Armor</td><td class="num">${ar.base}</td><td class="num">${ar.talents ? signed(ar.talents) : ""}</td><td class="num"><input class="adj num" id="armorgear" type="number" aria-label="Armor on your gear" value="${S.adjust.armor || 0}" title="Armor from your gear"></td><td class="num"><strong>${ar.total}</strong></td></tr>`;
  f += "</tbody></table>";
  for (const [key, label, tip, id] of [["spell_power", "Spell power", "Spell damage", "spellgear"], ["healing", "Healing", "Healing done", "healinggear"]]) {
    const x = sh[key]; if (!x || (x.base == null && !x.talents)) continue;
    f = f.replace("</tbody></table>", `<tr><td title="${tip}${x.from && x.from.length ? ": " + x.from.map((c) => `${c[0]} (${fmt(c[2])}% of ${c[1]})`).join(", ") : ""}">${label}</td><td class="num">${x.base ?? "–"}</td><td class="num">${x.talents ? signed(x.talents) : ""}</td><td class="num"><input class="adj num" id="${id}" type="number" aria-label="${label} on your gear" value="${S.adjust[key] || 0}" title="${label} from your gear and buffs"></td><td class="num"><strong>${x.total ?? "–"}</strong></td></tr></tbody></table>`);
  }
  const side = [];
  if (ar.base != null && ar.damage_reduction != null) side.push(`Damage reduction against your own level: <strong>${fmt(ar.damage_reduction)}%</strong>`);
  if (sh.block_value != null) side.push(`Block value from Strength: <strong>${sh.block_value}</strong> (the shield's own value is not included)`);
  if (sh.block_against) side.push(`Block chance against a level ${sh.block_against.level} ${sh.block_against.player ? "player" : "mob"}: <strong>${fmt(sh.block_against.chance)}%</strong>`);
  const focused = document.activeElement && ["armorgear", "spellgear", "healinggear"].includes(document.activeElement.id) ? document.activeElement.id : null;
  const keep = !!focused;
  const sel = keep ? document.activeElement.selectionStart : 0;
  $("figures").innerHTML = f + side.map((s) => `<p class="tiny">${s}</p>`).join("");
  if (keep) { const el = $(focused); el.focus(); try { el.setSelectionRange(sel, sel); } catch (_) {} }
  $("notes").innerHTML = sh.notes.map((n) => `<li>${esc(n)}</li>`).join("");
  const nm = sh.not_modelled;
  $("nmhead").hidden = !nm.length;
  $("notmodelled").innerHTML = nm.map((n) => `<p><strong>${esc(n.label)}</strong> (${n.ranks}): ${esc(n.parts.map((p) => p.why).join("; "))}</p>`).join("");
}

function renderValues() {
  const vals = S.result.values.filter((v) => Object.keys(v[S.mode]).length);
  const cols = ORDER.filter((k) => vals.some((v) => v[S.mode][k] != null));
  const maxima = Object.fromEntries(cols.map((k) => [k, Math.max(...vals.map((v) => Math.abs(v[S.mode][k] || 0)))]));
  let rows = vals.slice();
  if (S.sort) rows.sort((a, b) => Math.abs((b[S.mode][S.sort] || 0)) - Math.abs((a[S.mode][S.sort] || 0)));
  const head = cols.map((k) => `<th scope="col"><button type="button" data-sort="${k}" title="Sort by ${LABEL[k]}">${LABEL[k]}${S.sort === k ? " ↓" : ""}</button></th>`).join("");
  const body = rows.map((v) => `<tr><td>${esc(v.name)} <span class="tiny num">${v.ranks}/${v.max}</span></td>${cols.map((k) => {
    const x = v[S.mode][k]; if (x == null) return "<td></td>";
    const w = maxima[k] ? Math.round(Math.abs(x) / maxima[k] * 100) : 0;
    return `<td class="v num"><b class="${x < 0 ? "neg" : ""}" style="width:${w}%"></b><span>${metricText(k, x, true)}</span></td>`;
  }).join("")}</tr>`).join("");
  $("pane-values").innerHTML = `
    <div class="seg" role="group" aria-label="Which value to show">
      <button type="button" data-mode="now" aria-pressed="${S.mode === "now"}">Ranks you have</button>
      <button type="button" data-mode="next" aria-pressed="${S.mode === "next"}">One more rank</button>
    </div>
    <p class="hint">Each figure is the sheet with the talent minus the sheet without it${S.mode === "next" ? ", or with one more rank minus now" : ""}. It does not check that the rest of the build stays legal.</p>
    ${rows.length ? `<div style="overflow-x:auto"><table id="values"><thead><tr><th scope="col">Talent</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`
      : `<p class="empty">${S.mode === "now" ? "No talent in this build has a value the calculator can work out yet. Add talents in the tree." : "No talent here has a rank left that the calculator can value."}</p>`}`;
  $("pane-values").querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { S.mode = b.dataset.mode; renderValues(); }));
  $("pane-values").querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => { S.sort = S.sort === b.dataset.sort ? null : b.dataset.sort; renderValues(); }));
}

async function renderData() {
  if (!S.status) { try { S.status = await api("GET", "/api/status"); } catch (e) { $("pane-data").textContent = e.message; return; } }
  const st = S.status;
  const checks = st.checks.map((c) => `<li>${c.ok ? '<span class="ok">Passed</span>' : '<span class="bad">Needs a look</span>'} – ${esc(c.name)}${c.ok ? "" : "<ul>" + c.problems.map((p) => `<li>${esc(p)}</li>`).join("") + "</ul>"}</li>`).join("");
  const conf = st.confidence.map((c) => `<tr><td>${esc(c.item)}</td><td><span class="pill ${esc(c.status.replace(/ /g, "-"))}">${esc(c.status)}</span></td><td class="tiny" style="text-align:left">${esc(c.detail)}</td></tr>`).join("");
  $("pane-data").innerHTML = `
    <p>Game build <strong class="num">${esc(st.build)}</strong>${st.references ? `. Outside reference: <span class="tiny">${esc(st.references.source || "")}</span>` : ""}</p>
    ${st.icons ? `<p class="tiny">Talent icons: ${st.icons.cached} of ${st.icons.wanted} cached${st.icons.spellmisc ? "" : " (spell icon table not installed: python -m wowcalc.icons tables)"}${st.icons.cached < st.icons.wanted ? ". Add more with python -m wowcalc.icons import or fetch." : "."}</p>` : ""}
    <h3 class="sub">Data checks</h3><ul class="notes" style="color:inherit">${checks}</ul>
    <h3 class="sub">What the numbers rest on</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>Status</th><th style="text-align:left">Detail</th></tr></thead><tbody>${conf}</tbody></table></div>`;
}

// ------------------------------------------------------------------ saved builds
async function refreshBuilds() {
  try {
    const { builds } = await api("GET", "/api/builds");
    $("buildlist").innerHTML = builds.map((b) => `<option value="${esc(b.name)}">${esc(b.class)} ${esc(b.race)} ${esc(b.level)}</option>`).join("");
  } catch (e) { toast(e.message); }
}
async function saveBuild() {
  const name = $("buildname").value.trim();
  if (!name) { toast("Type a name for the build first."); return; }
  try { await api("PUT", "/api/builds/" + encodeURIComponent(name), request()); toast(`Saved “${name}”.`); await refreshBuilds(); } catch (e) { toast(e.message); }
}
async function loadBuild() {
  const name = $("buildname").value.trim();
  if (!name) { toast("Type or pick the name of a saved build."); return; }
  try {
    const b = await api("GET", "/api/builds/" + encodeURIComponent(name));
    S.race = b.race; S.alloc = b.alloc || {}; S.adjust = b.adjust || {};
    $("level").value = b.level; $("shield").checked = !!b.shield; $("attacker").value = b.attacker_level ?? ""; $("vsplayer").checked = !!b.vs_player;
    syncShield();
    document.querySelectorAll("[data-adj]").forEach((el) => { el.value = S.adjust[el.dataset.adj] || 0; });
    await pickClass(b.class, false);
    toast(b.warning || `Loaded “${name}”.`);
  } catch (e) { toast(e.message); }
}
async function deleteBuild() {
  const name = $("buildname").value.trim();
  if (!name) { toast("Type or pick the name of a saved build."); return; }
  if (!confirm(`Delete the saved build “${name}”?`)) return;
  try { await api("DELETE", "/api/builds/" + encodeURIComponent(name)); toast(`Deleted “${name}”.`); $("buildname").value = ""; await refreshBuilds(); } catch (e) { toast(e.message); }
}

init();
</script>
</body>
</html>
